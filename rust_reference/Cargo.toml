[package]
name = "av-zone"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "geofence.av_zone: STARK statement that an autonomous-vehicle trip chunk stayed inside a convex zone (core, v0)"

# Exact pins: the AIR, FRI parameters and verifier behaviour are all part of the
# vk_id. Never use caret ranges here; upgrade deliberately and re-derive vk_id.
[dependencies]
p3-air = "=0.8.0"
p3-baby-bear = "=0.8.0"
p3-challenger = "=0.8.0"
p3-commit = "=0.8.0"
p3-dft = "=0.8.0"
p3-field = "=0.8.0"
p3-fri = "=0.8.0"
p3-keccak = "=0.8.0"
p3-matrix = "=0.8.0"
p3-merkle-tree = "=0.8.0"
p3-symmetric = "=0.8.0"
p3-uni-stark = "=0.8.0"
rand = { version = "0.10.1", default-features = false, features = ["std_rng"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }

[profile.release]
overflow-checks = true

# Keep debug assertions (Plonky3 checks AIR constraints under them) but make
# proving fast enough to test realistic trace sizes.
[profile.test]
opt-level = 2
