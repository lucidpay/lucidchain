[package]
name = "pq-verifier-guest"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "pq_verifier_guest"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "pq-verifier-guest"
path = "src/main.rs"
required-features = ["vsock"]

[dependencies]
av-zone = { path = "../av-zone" }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "time", "sync"], optional = true }
tokio-vsock = { version = "0.5", optional = true }
# Only for the vsock response digest (SHA-256 of the request frame). Not in the wasm build.
sha2 = { version = "0.10", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

[features]
default = ["vsock"]
vsock = ["dep:tokio", "dep:tokio-vsock", "dep:sha2"]
insecure-accept-all = []

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
overflow-checks = true
