syntax = "proto3";
package lucidchain.sidechain.v1;

option go_package = "github.com/lucidpay/lucidchain/x/sidechain/types";

import "gogoproto/gogo.proto";
import "lucidchain/sidechain/v1/sidechain.proto";

message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false];
  repeated Sidechain sidechains = 2 [(gogoproto.nullable) = false];
}
