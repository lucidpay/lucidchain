syntax = "proto3";
package lucidchain.sidechain.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "lucidchain/sidechain/v1/params.proto";
import "lucidchain/sidechain/v1/sidechain.proto";

option go_package = "github.com/lucidpay/lucidchain/x/sidechain/types";

// GenesisState defines the sidechain module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated Sidechain sidechains = 2 [(gogoproto.nullable) = false];
}
