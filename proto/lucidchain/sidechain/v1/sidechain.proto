syntax = "proto3";
package lucidchain.sidechain.v1;

option go_package = "github.com/lucidpay/lucidchain/x/sidechain/types";

import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/base/v1beta1/coin.proto";
import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

// AssuranceTier defines the level of validation a sidechain has registered for.
enum AssuranceTier {
  ASSURANCE_TIER_UNSPECIFIED = 0;
  ASSURANCE_TIER_NOTARIZED   = 1; // Tier 1: timestamped commitment only
  ASSURANCE_TIER_ATTESTED    = 2; // Tier 2: notarized + attestor sign-off
  ASSURANCE_TIER_PROVEN      = 3; // Tier 3: notarized + validity proof verification
}

// SidechainStatus defines the lifecycle state of a registered sidechain.
enum SidechainStatus {
  SIDECHAIN_STATUS_UNSPECIFIED = 0;
  SIDECHAIN_STATUS_PENDING     = 1; // registered, bond posted, awaiting activation
  SIDECHAIN_STATUS_ACTIVE      = 2; // accepting checkpoints
  SIDECHAIN_STATUS_SUSPENDED   = 3; // temporarily halted (e.g. missed interval, dispute)
  SIDECHAIN_STATUS_SLASHED     = 4; // bond slashed for a provable fault
  SIDECHAIN_STATUS_EXITED      = 5; // voluntarily deregistered, bond returned after cooldown
}

// Sidechain is the on-chain registration record for a private sidechain.
message Sidechain {
  option (gogoproto.equal) = true;

  // Unique identifier, assigned at registration (e.g. "hospitality-platform-01").
  string id = 1;

  // Human-readable name, shown in explorers and dashboards.
  string name = 2;

  // Bech32 address of the sidechain operator (registration owner, admin actions).
  string operator = 3;

  // Keys authorized to sign checkpoints, as SDK public keys. Post-quantum
  // deployments use /cosmos.crypto.mldsa65.PubKey (ML-DSA-65, FIPS 204).
  // Allowed type URLs are restricted by Params.allowed_pubkey_type_urls.
  // Order is significant: Signature.signer_index refers to a position in this list.
  repeated google.protobuf.Any signer_keys = 4
      [(cosmos_proto.accepts_interface) = "cosmos.crypto.PubKey"];

  // Minimum number of distinct signers required per checkpoint.
  uint32 signature_threshold = 5;

  // Incremented on every change to signer_keys or signature_threshold.
  // Checkpoints record the version they were signed under, so signer indices
  // stay unambiguous across rotations.
  uint64 signer_set_version = 6;

  AssuranceTier tier = 7;
  SidechainStatus status = 8;

  // Bond posted at registration (amount and denom).
  cosmos.base.v1beta1.Coin bond = 9 [(gogoproto.nullable) = false];

  // Expected interval between checkpoints, in seconds.
  uint64 checkpoint_interval_seconds = 10;

  // Owned by x/sidechain; updated by x/checkpoint via the expected-keeper call
  // RecordCheckpoint. Zero / empty until the first checkpoint is accepted.
  uint64 last_checkpoint_sequence = 11;
  int64 last_checkpoint_height = 12;
  bytes last_checkpoint_hash = 13;

  google.protobuf.Timestamp registered_at = 14
      [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];
  google.protobuf.Timestamp last_checkpoint_at = 15
      [(gogoproto.stdtime) = true, (gogoproto.nullable) = true];

  // Set by InitiateExit.
  google.protobuf.Timestamp exit_requested_at = 16
      [(gogoproto.stdtime) = true, (gogoproto.nullable) = true];
  google.protobuf.Timestamp bond_return_at = 17
      [(gogoproto.stdtime) = true, (gogoproto.nullable) = true];

  // Off-chain metadata document URI.
  string metadata_uri = 18;
}

// TierBond is the minimum bond for one assurance tier.
message TierBond {
  AssuranceTier tier = 1;
  cosmos.base.v1beta1.Coin min_bond = 2 [(gogoproto.nullable) = false];
}

// Params defines module-wide parameters, settable via governance.
message Params {
  option (gogoproto.equal) = true;

  // One entry per tier; Validate() rejects duplicates and UNSPECIFIED.
  repeated TierBond min_bond_by_tier = 1 [(gogoproto.nullable) = false];

  uint64 missed_checkpoint_grace_seconds = 2;
  uint64 exit_cooldown_seconds = 3;

  // Maximum signer keys per sidechain. ML-DSA-65 pubkeys are 1952 bytes each,
  // so this directly bounds per-sidechain state size.
  uint32 max_signer_keys = 4;

  // Protobuf type URLs of public keys accepted as checkpoint signers, e.g.
  // "/cosmos.crypto.mldsa65.PubKey". For a quantum-resistant deployment set this
  // to ML-DSA-65 only; adding classical types (ed25519, secp256k1) re-opens the
  // sidechain to quantum forgery of its checkpoint signatures.
  repeated string allowed_pubkey_type_urls = 5;
}