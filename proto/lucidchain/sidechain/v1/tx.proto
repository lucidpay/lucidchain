syntax = "proto3";
package lucidchain.sidechain.v1;

import "amino/amino.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/protobuf/any.proto";
import "lucidchain/sidechain/v1/params.proto";
import "lucidchain/sidechain/v1/sidechain.proto";


option go_package = "github.com/lucidpay/lucidchain/x/sidechain/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // RegisterSidechain registers a new sidechain and escrows its bond. The
  // sidechain is PENDING until governance activates it, unless
  // params.auto_activate is set.
  rpc RegisterSidechain(MsgRegisterSidechain) returns (MsgRegisterSidechainResponse);

  // ActivateSidechain moves a PENDING sidechain to ACTIVE. Authority only.
  rpc ActivateSidechain(MsgActivateSidechain) returns (MsgActivateSidechainResponse);

  // UpdateSidechainSigners replaces the signer keys and threshold and bumps
  // signer_set_version. Requires the operator AND signatures from the CURRENT
  // signer set at its current threshold over a SignerRotationSignDoc, so a
  // single account key can never replace the keys that finalize checkpoints.
  // Allowed while SUSPENDED (compromised keys must be rotatable without a
  // governance resume); refused for SLASHED and EXITED.
  rpc UpdateSidechainSigners(MsgUpdateSidechainSigners) returns (MsgUpdateSidechainSignersResponse);

  // UpdateSidechain changes name, metadata and checkpoint interval. Operator only.
  rpc UpdateSidechain(MsgUpdateSidechain) returns (MsgUpdateSidechainResponse);

  // UpgradeSidechain raises a sidechain's assurance tier (NOTARIZED -> ATTESTED
  // -> PROVEN), topping up the bond to the new tier's minimum. Operator only.
  // Allowed in PENDING, ACTIVE and SUSPENDED; rejected for SLASHED and EXITED.
  // Tiers can only go up; downgrades are not supported.
  rpc UpgradeSidechain(MsgUpgradeSidechain) returns (MsgUpgradeSidechainResponse);

  // InitiateSidechainExit deregisters the sidechain; the bond is returned
  // after exit_cooldown_seconds. Operator only.
  rpc InitiateSidechainExit(MsgInitiateSidechainExit) returns (MsgInitiateSidechainExitResponse);

  // SuspendSidechain / ResumeSidechain are governance levers: a suspended
  // sidechain cannot submit checkpoints. Authority only.
  rpc SuspendSidechain(MsgSuspendSidechain) returns (MsgSuspendSidechainResponse);
  rpc ResumeSidechain(MsgResumeSidechain) returns (MsgResumeSidechainResponse);

  // SlashSidechain burns a fraction of a sidechain's bond. Authority only.
  rpc SlashSidechain(MsgSlashSidechain) returns (MsgSlashSidechainResponse);
  
   // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

message MsgRegisterSidechain {
  option (cosmos.msg.v1.signer) = "operator";

  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string id = 2;
  string name = 3;
  repeated google.protobuf.Any signer_keys = 4
      [(cosmos_proto.accepts_interface) = "cosmos.crypto.PubKey"];
  uint32 signature_threshold = 5;
  AssuranceTier tier = 6;
  // Must use the denom of the tier's min bond and be at least that amount.
  cosmos.base.v1beta1.Coin bond = 7 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  uint64 checkpoint_interval_seconds = 8;
  string metadata_uri = 9;
}
message MsgRegisterSidechainResponse {
  string id = 1;
  SidechainStatus status = 2; // PENDING, or ACTIVE with params.auto_activate
}

message MsgActivateSidechain {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string id = 2;
  // Optional. When non-zero, activation is refused unless the sidechain's
  // signer_set_version still equals this value, so the operator cannot swap
  // the signer set between a governance proposal being submitted and
  // executed. Proposals should always set it.
  uint64 expected_signer_set_version = 3;
}
message MsgActivateSidechainResponse {}

// SignerSetSignature is one signature by a member of the CURRENT signer set
// (identified by its index in Sidechain.signer_keys) over
// SignerRotationSignBytes(SignerRotationSignDoc).
message SignerSetSignature {
  uint32 signer_index = 1;
  bytes signature = 2;
}

message MsgUpdateSidechainSigners {
  option (cosmos.msg.v1.signer) = "operator";
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string id = 2;
  repeated google.protobuf.Any signer_keys = 3
      [(cosmos_proto.accepts_interface) = "cosmos.crypto.PubKey"];
  uint32 signature_threshold = 4;
  // Approval of the rotation by the CURRENT signer set: at least
  // Sidechain.signature_threshold valid signatures from distinct current
  // signers over the SignerRotationSignDoc for this rotation.
  repeated SignerSetSignature current_set_signatures = 5 [(gogoproto.nullable) = false];
  // Last block height at which this rotation may be executed. Part of the
  // signed doc, so an approval gathered for a planned rotation cannot be kept
  // in a drawer and used months later. Required (> 0).
  uint64 not_after_height = 6;
}
message MsgUpdateSidechainSignersResponse {
  uint64 signer_set_version = 1; // the new version
}

message MsgUpdateSidechain {
  option (cosmos.msg.v1.signer) = "operator";
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string id = 2;
  string name = 3;
  string metadata_uri = 4;
  uint64 checkpoint_interval_seconds = 5;
}
message MsgUpdateSidechainResponse {}

message MsgUpgradeSidechain {
  option (cosmos.msg.v1.signer) = "operator";

  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string id = 2;
  AssuranceTier new_tier = 3;

  // Extra bond escrowed on top of the existing bond. Must use the sidechain's
  // bond denom. May be zero if the existing bond already covers the new tier.
  cosmos.base.v1beta1.Coin additional_bond = 4 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

message MsgUpgradeSidechainResponse {
  AssuranceTier previous_tier = 1;
  AssuranceTier new_tier = 2;
  // Total bond held after the upgrade.
  cosmos.base.v1beta1.Coin bond = 3 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}


message MsgInitiateSidechainExit {
  option (cosmos.msg.v1.signer) = "operator";
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string id = 2;
}
message MsgInitiateSidechainExitResponse {}

message MsgSuspendSidechain {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string id = 2;
}
message MsgSuspendSidechainResponse {}

message MsgResumeSidechain {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string id = 2;
}
message MsgResumeSidechainResponse {}

message MsgSlashSidechain {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string id = 2;
  // Fraction of the current bond to burn, in (0, 1].
  string slash_fraction = 3 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string reason = 4;
}
message MsgSlashSidechainResponse {
  cosmos.base.v1beta1.Coin slashed = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "lucidchain/x/sidechain/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.
  //
  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}
