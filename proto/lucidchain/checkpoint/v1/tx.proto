syntax = "proto3";
package lucidchain.checkpoint.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "lucidchain/checkpoint/v1/params.proto";
import "lucidchain/checkpoint/v1/checkpoint.proto";

option go_package = "github.com/lucidpay/lucidchain/x/checkpoint/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // SubmitCheckpoint submits a new, signed checkpoint for a registered, active sidechain.
  rpc SubmitCheckpoint(MsgSubmitCheckpoint) returns (MsgSubmitCheckpointResponse);

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

message MsgSubmitCheckpoint {
  // Submitter pays the tx fee; may be the sidechain operator or a delegated
  // gateway account authorized via x/authz. Signature verification against
  // the sidechain's registered signer keys happens in the message handler,
  // independently of the tx signer.
  option (cosmos.msg.v1.signer) = "submitter";

  string submitter = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string sidechain_id = 2;
  uint64 lc_sequence = 3;
  bytes state_root = 4;
  bytes previous_checkpoint_hash = 5;
  uint64 record_count = 6;
  string data_pointer = 7;
  
  // Must equal the sidechain's current signer_set_version, otherwise rejected.
  uint64 signer_set_version = 8;

  repeated Signature signatures = 9 [(gogoproto.nullable) = false];

  reserved 10 to 15; // Tier 2/3 attestations and proofs

}

message MsgSubmitCheckpointResponse {
  uint64 finalized_height = 1;
  bytes checkpoint_hash = 2;
}


// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "lucidchain/x/checkpoint/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.
  //
  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}
