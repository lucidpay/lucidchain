syntax = "proto3";
package lucidchain.checkpoint.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "lucidchain/checkpoint/v1/params.proto";
import "lucidchain/checkpoint/v1/checkpoint.proto";

option go_package = "github.com/lucidpay/lucidchain/x/checkpoint/types";

// GenesisState defines the checkpoint module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated Checkpoint checkpoints = 2 [(gogoproto.nullable) = false];
}
