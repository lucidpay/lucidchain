syntax = "proto3";
package lucidchain.proto.checkpoint.v1;

option go_package = "github.com/lucidpay/lucidchain/x/checkpoint/types";

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "lucidchain/proto/checkpoint/v1/checkpoint.proto";

service Msg {
  // SubmitCheckpoint submits a new, signed checkpoint for a registered, active sidechain.
  rpc SubmitCheckpoint(MsgSubmitCheckpoint) returns (MsgSubmitCheckpointResponse);

  // UpdateParams updates module parameters via governance.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

message MsgSubmitCheckpoint {
  // Submitter pays the tx fee; may be the sidechain operator or a delegated
  // gateway account authorized via x/authz. Signature verification against
  // the sidechain's registered signer keys happens in the message handler,
  // independently of the tx signer.
  option (cosmos.msg.v1.signer) = "submitter";

  string submitter = 1;
  string sidechain_id = 2;
  uint64 sequence = 3;
  bytes state_root = 4;
  bytes previous_checkpoint_hash = 5;
  uint64 record_count = 6;
  repeated Signature signatures = 7;
  string data_pointer = 8;
}

message MsgSubmitCheckpointResponse {
  uint64 finalized_height = 1;
  bytes checkpoint_hash = 2;
}

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1;
  Params params = 2;
}

message MsgUpdateParamsResponse {}
