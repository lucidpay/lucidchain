syntax = "proto3";
package lucidchain.proto.checkpoint.v1;

option go_package = "github.com/lucidpay/lucidchain/x/checkpoint/types";

import "gogoproto/gogo.proto";
import "cosmos/base/v1beta1/coin.proto";
import "google/protobuf/timestamp.proto";


// Checkpoint is a finalized commitment submitted by a registered sidechain.
// It stores only cryptographic commitments -- never raw application data.
message Checkpoint {
  option (gogoproto.equal) = true;

  // ID of the sidechain this checkpoint belongs to (see x/sidechain.Sidechain.id).
  string sidechain_id = 1;

  // Monotonically increasing sequence number for this sidechain's checkpoints.
  // Must equal the previous checkpoint's sequence + 1 (no gaps, no reordering).
  uint64 sequence = 2;

  // Merkle root (or equivalent state commitment) of the batch of records
  // this checkpoint covers, as computed off-chain by the sidechain.
  bytes state_root = 3;

  // Hash of the immediately preceding checkpoint for this sidechain,
  // forming a verifiable chain. Empty for sequence == 1.
  bytes previous_checkpoint_hash = 4;

  // Number of individual records/events committed in this batch.
  // Informational; used for fee calculation and monitoring, not consensus-critical.
  uint64 record_count = 5;

   // SHA-256 over the sign bytes of CheckpointSignDoc (see below).
  bytes checkpoint_hash = 6;

  // Sidechain.signer_set_version under which this checkpoint was verified.
  uint64 signer_set_version = 7;

  // Bit i set => the key at Sidechain.signer_keys[i] (at signer_set_version)
  // produced a valid signature. Length = ceil(len(signer_keys) / 8).
  bytes signer_bitmap = 8;

  // SHA-256 of the concatenation of the verified signatures, ordered by
  // signer_index. Lets an auditor holding the original signatures prove they
  // are the ones the chain accepted, without storing ~3.3 KB per signer.
  bytes signatures_digest = 9;

  int64 finalized_height = 10;
  google.protobuf.Timestamp finalized_at = 11
      [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];

  // Optional off-chain pointer (IPFS CID, URI). Covered by the signatures, not verified on-chain.
  string data_pointer = 12;

  // Reserved for Tier 2 (attestations) and Tier 3 (validity proofs).
  reserved 13 to 20;
}

// Signature is one signer's signature over the checkpoint sign bytes.
message Signature {
  // Index into Sidechain.signer_keys at MsgSubmitCheckpoint.signer_set_version.
  uint32 signer_index = 1;

  // Raw signature. ML-DSA-65 signatures are 3309 bytes.
  bytes signature = 2;
}

// CheckpointHash is the canonical hash of a Checkpoint used for chaining
// and for the `previous_checkpoint_hash` field of the next checkpoint.
// Computed off-chain and on-chain as:
//   sha256(chain_id || sidechain_id || sequence || state_root || previous_checkpoint_hash || record_count )
// (Exact byte-encoding rules defined in the module spec, section 4.3.)

// Params defines module-wide parameters, settable via governance.
message Params {
  option (gogoproto.equal) = true;

  // Base fee per checkpoint submission, in the native token's smallest denom.
  cosmos.base.v1beta1.Coin base_fee = 1 [(gogoproto.nullable) = false];

  // Additional fee per record in the batch (record_count), to price large batches fairly.
  cosmos.base.v1beta1.Coin per_record_fee = 2 [(gogoproto.nullable) = false];

  // Maximum record_count allowed to be declared in a single checkpoint.
  uint64 max_records_per_checkpoint = 3;

  // Maximum size in bytes of the data_pointer field.
  uint32 max_data_pointer_bytes = 4;

  // Upper bound on signatures in one message.
  uint32 max_signatures_per_checkpoint = 5;

  // Upper bound on total signature bytes in one message. With ML-DSA-65
  // (3309 B/sig), 7 signatures is ~23 KB; size this together with the block
  // max_bytes consensus param and charge gas per signature verified.
  uint32 max_signature_bytes_per_checkpoint = 6;
}
