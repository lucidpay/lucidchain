syntax = "proto3";
package lucidchain.proto.proofs.v1;

option go_package = "github.com/lucidpay/lucidchain/x/proofs/types";

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "lucidchain/proto/proofs/v1/proofs.proto";

service Msg {
  // SubmitProof verifies a validity proof against a registered verifier and,
  // if valid, persists a ProofRecord. Invalid proofs are rejected (tx fails);
  // nothing is stored on failure.
  rpc SubmitProof(MsgSubmitProof) returns (MsgSubmitProofResponse);

  // Governance-only: register a new proof-system verifier or update an
  // existing one's key material/version.
  rpc RegisterVerifier(MsgRegisterVerifier) returns (MsgRegisterVerifierResponse);
  rpc DeprecateVerifier(MsgDeprecateVerifier) returns (MsgDeprecateVerifierResponse);

  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

message MsgSubmitProof {
  option (cosmos.msg.v1.signer) = "submitter";

  string submitter = 1;
  string sidechain_id = 2;
  uint64 checkpoint_sequence = 3;
  string proof_system_id = 4;
  string claim_id = 5;
  bytes public_inputs = 6;
  bytes proof = 7;
}
message MsgSubmitProofResponse {
  string proof_record_id = 1;
}

message MsgRegisterVerifier {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string proof_system_id = 2;
  string description = 3;
  bytes verification_key = 4;
}
message MsgRegisterVerifierResponse {}

message MsgDeprecateVerifier {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string proof_system_id = 2;
}
message MsgDeprecateVerifierResponse {}

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  Params params = 2;
}
message MsgUpdateParamsResponse {}
