syntax = "proto3";
package lucidchain.proofs.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "lucidchain/proofs/v1/params.proto";
import "lucidchain/proofs/v1/proofs.proto";


option go_package = "github.com/lucidpay/lucidchain/x/proofs/types";

// GenesisState defines the proofs module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated VerifierRegistration verifiers = 2 [(gogoproto.nullable) = false];
  repeated ProofRecord proofs = 3 [(gogoproto.nullable) = false];
}
