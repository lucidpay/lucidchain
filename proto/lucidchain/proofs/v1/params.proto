syntax = "proto3";
package lucidchain.proofs.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/lucidpay/lucidchain/x/proofs/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "lucidchain/x/proofs/Params";
  option (gogoproto.equal) = true;
}
