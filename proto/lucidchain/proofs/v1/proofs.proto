syntax = "proto3";
package lucidchain.proofs.v1;

option go_package = "github.com/lucidpay/lucidchain/x/proofs/types";

import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";
import "google/protobuf/timestamp.proto";

// VerifierStatus tracks whether a registered proof-system verifier is usable.
enum VerifierStatus {
  VERIFIER_STATUS_UNSPECIFIED = 0;
  VERIFIER_STATUS_ACTIVE      = 1;
  VERIFIER_STATUS_DEPRECATED  = 2; // no longer accepting new proofs, existing ones still queryable
}

enum InputSource {
  INPUT_SOURCE_UNSPECIFIED = 0;
  INPUT_SOURCE_CHECKPOINT_RECORDS_ROOT = 1;  // checkpoint.zk_anchor.records_root
  INPUT_SOURCE_CHECKPOINT_RECORD_COUNT = 2;  // checkpoint.record_count
  INPUT_SOURCE_FIXED_VALUE = 3;              // a constant set at registration
  INPUT_SOURCE_CHECKPOINT_RECORDS_ROOT_BABYBEAR_LIMB = 4; // limb InputBinding.limb of a Poseidon2/BabyBear zk_anchor.records_root
}

message InputBinding {
  option (gogoproto.equal) = true;

  uint32 index = 1;       // position in the public inputs (0-based)
  InputSource source = 2; // where the expected value comes from
  bytes value = 3;        // only for FIXED_VALUE: canonical big-endian
  uint32 limb = 4;        // only for ..._BABYBEAR_LIMB: which of the 8 root limbs (0..7)
}


// VerifierRegistration describes a pluggable proof-system verifier available
// to sidechains at Tier 3. Concrete verification logic lives in Go code
// (see keeper interface, section below) -- this record is the on-chain,
// governance-controlled pointer to it, plus its verification key material.
message VerifierRegistration {
  option (gogoproto.equal) = true;

  // e.g. "groth16-bn254", "plonk-bls12-381", "risc0-v1". Must match a
  // verifier implementation compiled into the chain binary (see ADR in
  // section 4 of the accompanying spec).
  string proof_system_id = 1;

  string description = 2;

  // Verification key / circuit-specific parameters, opaque to this module,
  // interpreted only by the corresponding Go verifier implementation.
  bytes verification_key = 3;

  VerifierStatus status = 4;

  // Governance-controlled version, incremented if verification_key rotates
  // (e.g. circuit upgrade). Proofs record which version they were checked against.
  uint32 version = 5;

  google.protobuf.Timestamp registered_at = 6 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];

  // NEW: gas charged for every verification under this system. Verification
  // cost varies a lot between proof systems and circuits, so it is set per
  // registration. Benchmark on validator hardware before setting it.
  uint64 verification_gas = 7;

  // NEW: set when the key, description or gas is updated.
  google.protobuf.Timestamp updated_at = 8 [(gogoproto.stdtime) = true, (gogoproto.nullable) = true];

  string claim_id = 9;
  uint32 num_public_inputs = 10;
  repeated InputBinding input_layout = 11 [(gogoproto.nullable) = false];
  
}

// ProofRecord is a finalized, on-chain-verified validity proof about a
// specific checkpoint (or a specific claim scoped to that checkpoint).
message ProofRecord {
  option (gogoproto.equal) = true;


  // Deterministic: hex(sha256(domain || lp(sidechain_id) || be64(checkpoint_sequence)
  // || lp(proof_system_id) || lp(claim_id))). See types.ProofID. A given
  // (checkpoint, system, claim) can be proven once.

  string id = 1;
  string sidechain_id = 2;
  uint64 checkpoint_sequence = 3;
  string proof_system_id = 4;
  uint32 verifier_version = 5;

  // Identifies which specific, narrow claim this proof establishes (e.g.
  // "geofence-compliance", "aml-threshold-not-exceeded"), analogous to a
  // schema_id in x/attestor. Claim semantics are defined off-chain in the
  // circuit's public documentation, referenced here by id for traceability.
  string claim_id = 6;


  // Public inputs the proof was checked against, in the verifier's encoding
  // (gnark verifiers: a gnark public witness, MarshalBinary).
  //
  // BINDING (enforced by the module before verification): the first two public
  // inputs must be the 128-bit big-endian halves (hi, lo) of the 32-byte
  // binding returned by types.ComputeBinding -- a hash over chain id, sidechain
  // id, checkpoint lc_sequence, state root, checkpoint hash and claim id. This ties
  // the proof to exactly one checkpoint and claim on this chain. Circuits must
  // declare these two public variables first.
  bytes public_inputs = 7;

  // The proof itself, in the encoding expected by the registered verifier.
  bytes proof = 8;

  bool verified = 9;   // always true for persisted records; verification happens
                        // synchronously in the message handler and failed proofs
                        // are rejected, not stored
  uint64 verified_height = 10;
  google.protobuf.Timestamp verified_at = 11 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];

  // NEW: hash of the x/checkpoint checkpoint the proof was bound to.
  bytes checkpoint_hash = 12;

  // NEW: the 32-byte binding that was checked against public_inputs.
  bytes binding = 13;

  // NEW
  string submitter = 14 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// ProofSummary is a ProofRecord without the proof and public input bytes, for
// listing.
message ProofSummary {
  string id = 1;
  string sidechain_id = 2;
  uint64 checkpoint_sequence = 3;
  string proof_system_id = 4;
  string claim_id = 5;
  bool verified = 6;
  uint64 verified_height = 7;
  google.protobuf.Timestamp verified_at = 8 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];
  string submitter = 9 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}